services:
  postgres:
    container_name: test-postgres
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_USER: auction_admin
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: airflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auction_admin", "-d", "airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - auction-network

  redis:
    container_name: test-redis
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - auction-network

  minio:
    container_name: test-minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: auction_admin
      MINIO_ROOT_PASSWORD: test1234!
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - auction-network

  mongodb:
    container_name: test-mongodb
    build:
      context: ./docker/mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: auction_admin
      MONGO_INITDB_ROOT_PASSWORD: test123
      MONGO_INITDB_DATABASE: auction_db
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - auction-network

networks:
  auction-network:
    external: true
    name: auction-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mongodb-data:
